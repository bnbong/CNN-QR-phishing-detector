# 실험 매트릭스 (스펙 7절)
# 각 항목은 base.yaml에 점 표기 오버라이드를 적용한 뒤 조건 id를 만든다.
#   id 규칙: {url_mode}-{length_match}-{features}-{mask_mode}-{arch}[-{extra}]
# decoded_text_reference: true면 같은 split에서 char n-gram LR(디코딩 텍스트 참조
# 기준, 강한 텍스트 베이스라인)을 함께 돌려 CNN과의 부호 있는 갭을 기록한다.
# 상한선이 아니므로 CNN이 넘어도 누출이 아니다. (옛 키 이름 text_upper_bound는 폐기)

P1:
  - name: main_cnn                     # 주 결과
    extra: null
    overrides:
      condition.url_mode: norm
      condition.length_match: exact
      condition.length_bucket: 1
      condition.features: data_only
      condition.shuffle_positions: false
      qr.mask_mode: fixed
      qr.mask_pattern: 0
      model.arch: small_cnn
    decoded_text_reference: true
    baselines: [version_lr, length_lr, bytehist_lr]

  - name: main_mlp                     # 공간 귀납편향 필요성
    extra: null
    overrides:
      condition.url_mode: norm
      condition.length_match: exact
      condition.features: data_only
      qr.mask_mode: fixed
      model.arch: bit_mlp
    decoded_text_reference: true
    baselines: []

  - name: shuffle_pos                  # H4
    extra: shufflepos
    overrides:
      condition.url_mode: norm
      condition.length_match: exact
      condition.features: data_only
      condition.shuffle_positions: true
      qr.mask_mode: fixed
      model.arch: small_cnn
    decoded_text_reference: false
    baselines: []

  - name: shuffle_pos_mlp              # H4 대조 (MLP는 불변이어야 한다)
    extra: shufflepos
    overrides:
      condition.url_mode: norm
      condition.length_match: exact
      condition.features: data_only
      condition.shuffle_positions: true
      qr.mask_mode: fixed
      model.arch: bit_mlp
    decoded_text_reference: false
    baselines: []

  - name: label_shuffle                # 영가설 바닥
    extra: labelshuffle
    label_shuffle: true
    overrides:
      condition.url_mode: norm
      condition.length_match: exact
      condition.features: data_only
      qr.mask_mode: fixed
      model.arch: small_cnn
    decoded_text_reference: false
    baselines: []

P2:
  - name: length_none                  # H3: 길이 아티팩트 크기
    extra: null
    overrides:
      condition.length_match: none
      condition.length_bucket: 1
      condition.features: data_only
      qr.mask_mode: fixed
      model.arch: small_cnn
    decoded_text_reference: true
    baselines: [length_lr, version_lr]

  - name: length_quantile
    extra: null
    overrides:
      condition.length_match: quantile
      condition.length_bucket: 5
      condition.features: data_only
      qr.mask_mode: fixed
      model.arch: small_cnn
    decoded_text_reference: true
    baselines: [length_lr]

  - name: url_raw
    extra: null
    overrides:
      condition.url_mode: raw
      condition.length_match: exact
      condition.features: data_only
      qr.mask_mode: fixed
      model.arch: small_cnn
    decoded_text_reference: true
    baselines: []

  - name: feat_all
    extra: null
    overrides:
      condition.length_match: exact
      condition.features: all
      qr.mask_mode: fixed
      model.arch: small_cnn
    decoded_text_reference: true
    baselines: []

  - name: mask_auto                    # + 마스크 인덱스 LR로 프록시 강도 정량화
    extra: null
    overrides:
      condition.length_match: exact
      condition.features: data_only
      qr.mask_mode: auto
      model.arch: small_cnn
    decoded_text_reference: true
    baselines: [maskindex_lr]

  - name: mask_off                     # 해석 주력(비규격 격자)
    extra: null
    overrides:
      condition.length_match: exact
      condition.features: data_only
      qr.mask_mode: "off"
      model.arch: small_cnn
    decoded_text_reference: true
    baselines: []

  - name: pad_rand                     # 인과 절제: L-none 위에서 실행
    extra: padrand
    overrides:
      condition.length_match: none
      condition.features: data_only
      qr.mask_mode: fixed
      qr.pad_mode: random
      model.arch: small_cnn
    decoded_text_reference: true
    baselines: []

  - name: path_plus                    # 가장 정직한 조건. 표본이 남으면 본문 표로
    extra: pathplus
    overrides:
      condition.length_match: exact
      condition.features: data_only
      condition.path_filter: true
      qr.mask_mode: fixed
      model.arch: small_cnn
    decoded_text_reference: true
    baselines: [length_lr]

  - name: ec_m                         # v3 층 한정 강건성 확인
    extra: ecm
    strata: ["v3"]
    overrides:
      condition.length_match: exact
      condition.features: data_only
      qr.ec: M
      qr.mask_mode: fixed
      model.arch: small_cnn
    decoded_text_reference: true
    baselines: []

# G(피싱 키트 템플릿 누출)는 matrix 항목에서 제거했다. 옛 ``template_split``은
# eTLD+1 분할과 템플릿 합집합 분할의 AUROC를 그냥 뺐는데, 1차 test 행의 88%가
# 템플릿 분할에서 test를 떠나 학습 조건과 평가 대상이 함께 바뀌었다(review_02 3절).
# 대신 고정 캠페인 test 집합 위의 쌍체 A/B 비교를 쓴다:
#   qrphish.runner.run_campaign_holdout(cfg)  →  reports/campaign/{stratum}/results.json
